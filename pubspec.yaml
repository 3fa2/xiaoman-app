name: trinity
description: "三位一体 v4 - 日记本 + 备忘录 + 日程时间表"
publish_to: "none"
version: 4.3.1+17

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.2.0

  # 转场动效（Flutter 团队维护：FadeThrough / SharedAxis / OpenContainer）
  animations: ^2.0.11

  # 自动保存互斥（MoeMemos 模式）
  synchronized: ^3.1.0

  # 日历
  table_calendar: ^3.1.2

  # 本地通知
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Markdown
  flutter_markdown: ^0.7.4+1
  markdown: ^7.2.1

  # 媒体
  image_picker: ^1.1.2
  video_player: ^2.9.1
  video_thumbnail: ^0.5.3
  photo_manager: ^3.12.0

  # 相册选择器（微信风格，Apache-2.0）
  wechat_assets_picker: ^10.1.3

  # 权限
  permission_handler: ^11.3.1

  # 图表
  fl_chart: ^0.69.0

  # 文件 / 路径
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^7.2.2

  # 工具
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8

  # 图标库（统一 Phosphor 线性风格）
  phosphor_flutter: ^2.1.0

  # 语音转文字（日记/笔记编辑器语音输入）
  speech_to_text: ^7.0.0

  # 密码锁哈希
  crypto: ^3.0.3

  # 生物识别
  local_auth: ^2.3.0

  # 数据层：Drift + FTS5
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  sqlite3: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
