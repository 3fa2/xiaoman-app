distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Keep the ORIGINAL url (wrapper caches by url hash; changing it re-downloads).
# Build-chain upgrade to Gradle 9 is blocked by Flutter 3.47.4: flutter_tools gradle
# module pins kotlin-dsl 6.2.0 which only supports Gradle 8.x. Retry after a Flutter
# SDK upgrade. If the wrapper must re-download, mirrors.cloud.tencent.com/gradle works.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
